<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin Dashboard - Company Portal</title>
    <link rel="stylesheet" href="../css/styles.css">
    <style>
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
        }

        body {
            font-family: Arial, sans-serif;
            background: #f5f5f5;
        }

        .dashboard-container {
            display: flex;
            min-height: 100vh;
        }

        .sidebar {
            width: 250px;
            background: #2c3e50;
            color: white;
            padding: 20px;
            position: fixed;
            height: 100vh;
            overflow-y: auto;
        }

        .sidebar h2 {
            margin-bottom: 30px;
            font-size: 24px;
        }

        .user-info {
            background: rgba(255, 255, 255, 0.1);
            padding: 15px;
            border-radius: 5px;
            margin-bottom: 30px;
        }

        .user-info p {
            margin: 5px 0;
            font-size: 14px;
        }

        .user-role {
            display: inline-block;
            background: #3498db;
            padding: 3px 10px;
            border-radius: 3px;
            font-size: 12px;
            margin-top: 5px;
        }

        .nav-menu {
            list-style: none;
        }

        .nav-menu li {
            margin-bottom: 10px;
        }

        .nav-menu a {
            display: block;
            color: white;
            text-decoration: none;
            padding: 12px 15px;
            border-radius: 5px;
            transition: background 0.3s;
        }

        .nav-menu a:hover,
        .nav-menu a.active {
            background: rgba(255, 255, 255, 0.1);
        }

        .logout-btn {
            margin-top: 30px;
            width: 100%;
            padding: 12px;
            background: #e74c3c;
            color: white;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
        }

        .logout-btn:hover {
            background: #c0392b;
        }

        .main-content {
            margin-left: 250px;
            flex: 1;
            padding: 30px;
        }

        .header {
            background: white;
            padding: 20px 30px;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            margin-bottom: 30px;
        }

        .header h1 {
            color: #2c3e50;
            font-size: 28px;
        }

        .stats-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(250px, 1fr));
            gap: 20px;
            margin-bottom: 30px;
        }

        .stat-card {
            background: white;
            padding: 25px;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        .stat-card h3 {
            color: #7f8c8d;
            font-size: 14px;
            margin-bottom: 10px;
            text-transform: uppercase;
        }

        .stat-card .number {
            font-size: 36px;
            font-weight: bold;
            color: #2c3e50;
        }

        .content-section {
            display: none;
        }

        .content-section.active {
            display: block;
        }

        .welcome-section {
            background: white;
            padding: 40px;
            border-radius: 10px;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
            text-align: center;
        }

        .welcome-section h2 {
            color: #2c3e50;
            margin-bottom: 20px;
        }

        .welcome-section p {
            color: #7f8c8d;
            line-height: 1.6;
        }

        .quick-actions {
            margin-top: 25px;
            display: flex;
            justify-content: center;
            gap: 12px;
        }

        .btn {
            padding: 10px 18px;
            border: none;
            border-radius: 6px;
            font-size: 14px;
            font-weight: 600;
            cursor: pointer;
        }

        .btn-primary {
            background: #3498db;
            color: #fff;
        }

        .btn-primary:hover {
            background: #2980b9;
        }
    </style>
</head>
<body>
    <div class="dashboard-container">
        <aside class="sidebar">
            <h2>Admin Panel</h2>
            
            <div class="user-info">
                <p><strong id="userName">Loading...</strong></p>
                <p id="userEmail">email@example.com</p>
                <span class="user-role" id="userRole">Role</span>
            </div>
            
            <ul class="nav-menu" id="navMenu">
                <li><a href="#" data-section="dashboard" class="active">Dashboard</a></li>
                <li id="careersNav" style="display: none;"><a href="#" data-section="careers">Careers</a></li>
                <li id="supportNav" style="display: none;"><a href="#" data-section="support">Support Tickets</a></li>
                <li id="enquiriesNav" style="display: none;"><a href="#" data-section="enquiries">Enquiries</a></li>
                <li id="usersNav" style="display: none;"><a href="#" data-section="users">Users</a></li>
            </ul>
            
            <button class="logout-btn" id="logoutBtn">Logout</button>
        </aside>
        
        <main class="main-content">
            <div class="header">
                <h1 id="pageTitle">Dashboard</h1>
            </div>
            
            <!-- Dashboard Section -->
            <div id="dashboard" class="content-section active">
                <div class="stats-grid" id="statsGrid">
                    <!-- Stats will be loaded dynamically -->
                </div>
                
                <div class="welcome-section">
                    <h2>Welcome to the Admin Panel</h2>
                    <p>Use the navigation menu to access different sections based on your role.</p>
                    <div class="quick-actions" id="superAdminQuickActions" style="display: none;">
                        <button class="btn btn-primary" id="quickAddUserBtn">+ Add New User</button>
                    </div>
                </div>
            </div>
            
            <!-- Careers Section -->
            <div id="careers" class="content-section">
                <iframe src="admin-careers.html" style="width: 100%; min-height: 800px; border: none;"></iframe>
            </div>
            
            <!-- Support Section -->
            <div id="support" class="content-section">
                <iframe src="admin-support.html" style="width: 100%; min-height: 800px; border: none;"></iframe>
            </div>

            <!-- Enquiries Section -->
            <div id="enquiries" class="content-section">
                <iframe src="admin-enquiries.html" style="width: 100%; min-height: 800px; border: none;"></iframe>
            </div>
            
            <!-- Users Section -->
            <div id="users" class="content-section">
                <iframe id="usersFrame" src="admin-users.html" style="width: 100%; min-height: 800px; border: none;"></iframe>
            </div>
        </main>
    </div>

    <script src="../js/admin-dashboard.js"></script>
</body>
</html>
