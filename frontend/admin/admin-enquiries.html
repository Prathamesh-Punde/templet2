<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Enquiries Management</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background: #f5f5f5;
        }

        .action-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            gap: 15px;
            margin-bottom: 20px;
            flex-wrap: wrap;
        }

        .filter-controls {
            display: flex;
            gap: 10px;
            flex-wrap: wrap;
        }

        .filter-controls select {
            padding: 8px 15px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
        }

        .btn-primary { background: #3498db; color: white; }
        .btn-success { background: #2ecc71; color: white; }
        .btn-danger { background: #e74c3c; color: white; }
        .btn-warning { background: #f39c12; color: white; }
        .btn-secondary { background: #7f8c8d; color: white; }
        .btn:hover { opacity: 0.9; }

        .enquiries-table {
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #eee;
            vertical-align: top;
        }

        th {
            background: #34495e;
            color: white;
            font-weight: 600;
        }

        .status-badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 3px;
            font-size: 12px;
            font-weight: 600;
            text-transform: uppercase;
        }

        .status-new { background: #fff3cd; color: #856404; }
        .status-contacted { background: #d1ecf1; color: #0c5460; }
        .status-converted { background: #d4edda; color: #155724; }
        .status-closed { background: #f8d7da; color: #721c24; }
        .status-asked_for_next_followup { background: #e2e3ff; color: #383d66; }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
        }

        .modal.show {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 10px;
            max-width: 850px;
            width: 95%;
            max-height: 92vh;
            overflow-y: auto;
        }

        .detail-grid {
            display: grid;
            grid-template-columns: repeat(auto-fit, minmax(220px, 1fr));
            gap: 12px;
            margin: 15px 0 20px;
        }

        .detail-box {
            background: #f8f9fa;
            padding: 12px 14px;
            border-radius: 8px;
        }

        .detail-box .label {
            display: block;
            font-size: 12px;
            text-transform: uppercase;
            color: #7f8c8d;
            margin-bottom: 5px;
            font-weight: 700;
        }

        .detail-box .value {
            font-size: 14px;
            color: #2c3e50;
            line-height: 1.5;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
        }

        .form-group textarea {
            min-height: 90px;
            resize: vertical;
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
            flex-wrap: wrap;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: #7f8c8d;
        }
    </style>
</head>
<body>
    <div class="action-bar">
        <h2>Enquiries Management</h2>
        <div class="filter-controls">
            <select id="statusFilter">
                <option value="">All Status</option>
                <option value="new">New</option>
                <option value="contacted">Contacted</option>
                <option value="converted">Converted</option>
                <option value="closed">Closed</option>
                <option value="asked_for_next_followup">Asked for Next Follow-Up</option>
            </select>
            <button class="btn btn-primary" id="refreshBtn">Refresh</button>
        </div>
    </div>

    <div class="enquiries-table">
        <table>
            <thead>
                <tr>
                    <th>Name</th>
                    <th>Contact</th>
                    <th>Subject</th>
                    <th>Status</th>
                    <th>Call Time</th>
                    <th>Next Follow-Up</th>
                    <th>Handled By</th>
                    <th>Created</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="enquiriesTableBody">
                <tr>
                    <td colspan="9" class="empty-state">Loading...</td>
                </tr>
            </tbody>
        </table>
    </div>

    <div class="modal" id="enquiryModal">
        <div class="modal-content">
            <h3 id="modalTitle">Enquiry Details</h3>
            <div id="enquiryDetails"></div>

            <h3 style="margin-top: 24px;">Update Follow-Up</h3>
            <form id="enquiryForm">
                <input type="hidden" id="enquiryId">

                <div class="form-group">
                    <label for="call_time">Call Time *</label>
                    <input type="time" id="call_time" required>
                </div>

                <div class="form-group">
                    <label for="status">Status *</label>
                    <select id="status" required>
                        <option value="new">New</option>
                        <option value="contacted">Contacted</option>
                        <option value="converted">Converted</option>
                        <option value="closed">Closed</option>
                        <option value="asked_for_next_followup">Asked for Next Follow-Up</option>
                    </select>
                </div>

                <div class="form-group" id="nextFollowUpGroup" style="display: none;">
                    <label for="next_followup_date">Next Follow-Up Date *</label>
                    <input type="date" id="next_followup_date">
                </div>

                <div class="form-group">
                    <label for="comments">Comments *</label>
                    <textarea id="comments" required placeholder="Write call details and next steps..."></textarea>
                </div>

                <div class="modal-actions">
                    <button type="submit" class="btn btn-success">Save Update</button>
                    <button type="button" class="btn btn-secondary" id="closeModalBtn">Close</button>
                </div>
            </form>
        </div>
    </div>

    <script src="../js/admin/admin-enquiries.js"></script>
</body>
</html>
