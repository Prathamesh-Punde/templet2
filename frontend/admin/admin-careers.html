<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Careers Management</title>
    <style>
        body {
            font-family: Arial, sans-serif;
            padding: 20px;
            background: #f5f5f5;
        }

        .action-bar {
            display: flex;
            justify-content: space-between;
            align-items: center;
            margin-bottom: 20px;
        }

        .btn {
            padding: 10px 20px;
            border: none;
            border-radius: 5px;
            cursor: pointer;
            font-size: 14px;
            font-weight: 600;
        }

        .btn-primary {
            background: #3498db;
            color: white;
        }

        .btn-success {
            background: #2ecc71;
            color: white;
        }

        .btn-danger {
            background: #e74c3c;
            color: white;
        }

        .btn-warning {
            background: #f39c12;
            color: white;
        }

        .btn:hover {
            opacity: 0.9;
        }

        .careers-table {
            background: white;
            border-radius: 10px;
            overflow: hidden;
            box-shadow: 0 2px 5px rgba(0, 0, 0, 0.1);
        }

        table {
            width: 100%;
            border-collapse: collapse;
        }

        th, td {
            padding: 15px;
            text-align: left;
            border-bottom: 1px solid #eee;
        }

        th {
            background: #34495e;
            color: white;
            font-weight: 600;
        }

        .status-badge {
            display: inline-block;
            padding: 3px 10px;
            border-radius: 3px;
            font-size: 12px;
            font-weight: 600;
        }

        .status-active {
            background: #d4edda;
            color: #155724;
        }

        .status-inactive {
            background: #f8d7da;
            color: #721c24;
        }

        .modal {
            display: none;
            position: fixed;
            top: 0;
            left: 0;
            width: 100%;
            height: 100%;
            background: rgba(0, 0, 0, 0.5);
            z-index: 1000;
        }

        .modal.show {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .modal-content {
            background: white;
            padding: 30px;
            border-radius: 10px;
            max-width: 600px;
            width: 90%;
            max-height: 90vh;
            overflow-y: auto;
        }

        .form-group {
            margin-bottom: 15px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            font-weight: 600;
        }

        .form-group input,
        .form-group textarea,
        .form-group select {
            width: 100%;
            padding: 10px;
            border: 1px solid #ddd;
            border-radius: 5px;
            font-size: 14px;
        }

        .form-group textarea {
            min-height: 100px;
            resize: vertical;
        }

        .modal-actions {
            display: flex;
            gap: 10px;
            margin-top: 20px;
        }

        .empty-state {
            text-align: center;
            padding: 40px;
            color: #7f8c8d;
        }
    </style>
</head>
<body>
    <div class="action-bar">
        <h2>Careers Management</h2>
        <button class="btn btn-primary" id="addCareerBtn">+ Add New Career</button>
    </div>

    <div class="careers-table">
        <table>
            <thead>
                <tr>
                    <th>Job Title</th>
                    <th>Department</th>
                    <th>Location</th>
                    <th>Type</th>
                    <th>Status</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="careersTableBody">
                <tr>
                    <td colspan="6" class="empty-state">Loading...</td>
                </tr>
            </tbody>
        </table>
    </div>

    <div class="action-bar" style="margin-top: 28px;">
        <h2>Candidate Applications</h2>
        <button class="btn btn-primary" id="refreshApplicationsBtn">Refresh</button>
    </div>

    <div class="careers-table">
        <table>
            <thead>
                <tr>
                    <th>Candidate</th>
                    <th>Email</th>
                    <th>Job Title</th>
                    <th>Experience</th>
                    <th>Status</th>
                    <th>Applied On</th>
                    <th>Actions</th>
                </tr>
            </thead>
            <tbody id="applicationsTableBody">
                <tr>
                    <td colspan="7" class="empty-state">Loading applications...</td>
                </tr>
            </tbody>
        </table>
    </div>

    <!-- Add/Edit Modal -->
    <div class="modal" id="careerModal">
        <div class="modal-content">
            <h3 id="modalTitle">Add New Career</h3>
            <form id="careerForm">
                <input type="hidden" id="careerId">
                
                <div class="form-group">
                    <label for="job_title">Job Title *</label>
                    <input type="text" id="job_title" required>
                </div>
                
                <div class="form-group">
                    <label for="department">Department *</label>
                    <input type="text" id="department" required>
                </div>
                
                <div class="form-group">
                    <label for="location">Location *</label>
                    <input type="text" id="location" required>
                </div>
                
                <div class="form-group">
                    <label for="employment_type">Employment Type *</label>
                    <select id="employment_type" required>
                        <option value="">Select Type</option>
                        <option value="Full-time">Full-time</option>
                        <option value="Part-time">Part-time</option>
                        <option value="Contract">Contract</option>
                        <option value="Internship">Internship</option>
                    </select>
                </div>
                
                <div class="form-group">
                    <label for="salary_range">Salary Range</label>
                    <input type="text" id="salary_range" placeholder="e.g., $50,000 - $70,000">
                </div>
                
                <div class="form-group">
                    <label for="description">Description *</label>
                    <textarea id="description" required></textarea>
                </div>
                
                <div class="form-group">
                    <label for="requirements">Requirements *</label>
                    <textarea id="requirements" required></textarea>
                </div>
                
                <div class="form-group">
                    <label for="responsibilities">Responsibilities *</label>
                    <textarea id="responsibilities" required></textarea>
                </div>
                
                <div class="form-group">
                    <label for="is_active">Status *</label>
                    <select id="is_active" required>
                        <option value="true">Active</option>
                        <option value="false">Inactive</option>
                    </select>
                </div>
                
                <div class="modal-actions">
                    <button type="submit" class="btn btn-success">Save</button>
                    <button type="button" class="btn btn-danger" id="cancelBtn">Cancel</button>
                </div>
            </form>
        </div>
    </div>

    <div class="modal" id="applicationReviewModal">
        <div class="modal-content">
            <h3>Review Candidate Application</h3>
            <div id="applicationReviewContent"></div>
            <div class="modal-actions">
                <button type="button" class="btn btn-success" id="keepApplicationBtn">Keep</button>
                <button type="button" class="btn btn-danger" id="rejectApplicationBtn">Reject</button>
            </div>
        </div>
    </div>

    <script src="../js/admin/admin-careers.js"></script>
</body>
</html>
